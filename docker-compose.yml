# Local PostgreSQL for HYDRA development (optional — `npm run db:start` uses embedded PostgreSQL
# when Docker is not available). Credentials here are local-development only.
services:
  db:
    image: postgres:17-alpine
    container_name: hydra-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hydra
      POSTGRES_PASSWORD: hydra_local_dev
      POSTGRES_DB: hydra
    ports:
      - '5433:5432'
    volumes:
      - hydra-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hydra -d hydra']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  hydra-pgdata:
